<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sports Legends Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;800&family=Graduate&family=Russo+One&display=swap">
<style>
/* Layout: full-bleed 3D stadium; skewed broadcast-scoreboard chips pinned top-left and top-right; action buttons bottom-center; one modal panel centered. */
:root {
  --ink: #0a1430;
  --panel: #111d3d;
  --panel-row: #1a2a52;
  --line: #2b3f70;
  --paper: #ffffff;
  --dim: #aebbd6;
  --cash: #22c55e;
  --gold: #fbbf24;
  --hot: #ef4444;
  --muted: #4b5a7c;
  --accent: #3b82f6;
  --scrim: rgb(4 9 24 / 0.78);
  --sky: #9fd3ff;
  --common: #cbd5e1;
  --uncommon: #4ade80;
  --rare: #38bdf8;
  --epic: #c084fc;
  --legendary: #fbbf24;
  --display: "Graduate", "Rockwell", Georgia, serif;
  --score: "Russo One", "Arial Black", system-ui, sans-serif;
  --body: "Barlow", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--sky);
  color: var(--paper);
  font-family: var(--body);
  font-weight: 600;
  user-select: none;
  -webkit-user-select: none;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }

/* ---------- Scoreboard chips ---------- */
.chip {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 16px 6px 12px;
  background: var(--panel);
  border-left: 6px solid var(--accent);
  box-shadow: 0 4px 0 var(--ink);
  transform: skewX(-12deg);
}
.chip > * { transform: skewX(12deg); }
#hud-left {
  position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 22px;
  display: grid; gap: 10px; justify-items: start; pointer-events: none;
}
.cash { border-left-color: var(--cash); }
.badge {
  display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
  background: var(--cash); color: var(--ink); font-family: var(--score); font-size: 21px;
  box-shadow: inset 0 -3px 0 rgb(0 0 0 / 0.25);
}
#cash { font-family: var(--score); font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 3ch; }
#cash.bump { animation: bump 0.25s ease-out; }
@keyframes bump { 50% { transform: skewX(12deg) scale(1.18); } }
.bag { position: relative; width: 250px; max-width: calc(100vw - 60px); height: 32px; padding: 0; overflow: hidden; }
.chip > .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); opacity: 0.85; transform: none; transition: width 0.15s; }
#bag-text { position: relative; width: 100%; text-align: center; font-family: var(--score); font-size: 17px; font-variant-numeric: tabular-nums; }
.small { font-size: 14px; color: var(--dim); padding-block: 4px; }
.small b { color: var(--gold); font-weight: 800; }

#hud-right {
  position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: 22px;
  display: flex; gap: 10px; align-items: start;
}
.place { flex-direction: column; align-items: flex-end; gap: 0; padding: 6px 18px; pointer-events: none; }
#place-world { font-family: var(--score); font-size: 18px; }
#place-zone { font-size: 14px; color: var(--dim); }
.icon-btn {
  width: 46px; height: 46px; display: grid; place-items: center; padding: 0;
  background: var(--panel); color: var(--paper); border: 0; border-left: 6px solid var(--accent);
  box-shadow: 0 4px 0 var(--ink); transform: skewX(-12deg); cursor: pointer;
}
.icon-btn svg { transform: skewX(12deg); }
.icon-btn:focus-visible, .btn:focus-visible, .tab:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

#help {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  width: max-content; max-width: calc(100% - 32px); box-sizing: border-box;
  margin: 0; padding: 4px 14px; text-align: center; font-size: 15px; letter-spacing: 0.02em;
  background: rgb(10 20 48 / 0.6); pointer-events: none;
}
#bar {
  position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; pointer-events: none;
}
#bar .btn { pointer-events: auto; }

/* ---------- Buttons ---------- */
.btn {
  font-family: var(--score); font-size: 18px; letter-spacing: 0.02em; color: var(--paper);
  background: var(--accent); border: 0; padding: 10px 22px;
  transform: skewX(-12deg); box-shadow: 0 5px 0 var(--ink); cursor: pointer;
}
.btn:hover:not(:disabled) { filter: brightness(1.12); }
.btn:active:not(:disabled) { transform: skewX(-12deg) translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.btn:disabled { background: var(--muted); color: var(--dim); cursor: not-allowed; }
.btn.go { background: var(--cash); }
.btn.gold { background: var(--gold); color: var(--ink); }
.btn.hot { background: var(--hot); }
.btn.off { background: var(--muted); }
.btn.wide { width: 100%; font-size: 21px; padding-block: 12px; }

/* ---------- Toast, banners, popups ---------- */
#toast {
  position: fixed; top: 15%; left: 16px; right: 16px; display: grid; justify-items: center; gap: 6px;
  opacity: 0; transform: translateY(-10px) scale(0.96); transition: opacity 0.35s, transform 0.35s; pointer-events: none;
}
#toast.show { opacity: 1; transform: none; }
#toast-kicker {
  font-family: var(--score); font-size: 16px; letter-spacing: 0.18em; padding: 4px 14px;
  background: var(--accent); transform: skewX(-12deg); box-shadow: 0 3px 0 var(--ink);
}
#toast-title {
  font-family: var(--display); font-size: clamp(34px, 6.5vw, 70px); line-height: 1.05; text-align: center; text-wrap: balance;
  paint-order: stroke fill; -webkit-text-stroke: 10px var(--ink);
}
#full {
  position: fixed; top: 31%; left: 16px; right: 16px; text-align: center;
  font-family: var(--score); font-size: clamp(20px, 3.6vw, 30px); color: var(--gold);
  paint-order: stroke fill; -webkit-text-stroke: 7px var(--ink);
  pointer-events: none; animation: pulse 0.9s ease-in-out infinite alternate;
}
@keyframes pulse { to { transform: scale(1.06); } }
#fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.pop {
  position: absolute; font-family: var(--score); font-size: 24px; white-space: nowrap;
  paint-order: stroke fill; -webkit-text-stroke: 6px var(--ink);
  animation: rise 0.9s ease-out forwards;
}
.pop.cashpop { color: var(--cash); font-size: 34px; }
.pop.info { color: var(--gold); }
@keyframes rise {
  from { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
  to { transform: translate(-50%, calc(-50% - 64px)) scale(1); opacity: 0; }
}
.coin-fly {
  position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%;
  display: grid; place-items: center; font-family: var(--score); font-size: 14px; color: var(--ink);
  background: var(--cash); box-shadow: inset 0 -3px 0 rgb(0 0 0 / 0.25), 0 0 0 3px var(--ink);
  transition: transform 0.65s cubic-bezier(0.55, -0.35, 0.7, 1), opacity 0.65s;
}
#flash { position: fixed; inset: 0; background: var(--paper); opacity: 0; pointer-events: none; }
#flash.go { animation: flash 0.55s ease-out; }
@keyframes flash { from { opacity: 0.9; } to { opacity: 0; } }
#fade { position: fixed; inset: 0; background: var(--ink); opacity: 0; pointer-events: none; transition: opacity 0.35s; }
#fade.on { opacity: 1; pointer-events: auto; }
#loading {
  position: fixed; inset: 0; display: grid; place-content: center; gap: 10px; text-align: center;
  background: var(--ink); font-family: var(--display); font-size: clamp(26px, 5vw, 44px);
}
#loading small { font-family: var(--body); font-size: 16px; color: var(--dim); }

/* ---------- Panels ---------- */
#panel {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
  box-sizing: border-box; width: min(560px, calc(100% - 32px)); max-height: calc(100% - 170px);
  overflow-y: auto; padding: 20px; display: grid; gap: 12px;
  background: var(--panel); border-top: 6px solid var(--accent); box-shadow: 0 10px 0 var(--ink), 0 20px 50px rgb(0 0 0 / 0.4);
}
#panel h2 { margin: 0 56px 0 0; font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1.1; text-wrap: balance; }
.kicker { margin: 0 0 -6px; font-family: var(--score); font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
.note { margin: 0; font-size: 16px; line-height: 1.45; color: var(--dim); max-width: 60ch; }
.note b { color: var(--paper); font-weight: 800; }
.close { position: absolute; top: 14px; right: 16px; width: 44px; height: 40px; padding: 0; font-size: 18px; }
.tabs { display: flex; gap: 10px; }
.tab {
  flex: 1; font-family: var(--score); font-size: 16px; padding: 8px; border: 0; cursor: pointer;
  color: var(--dim); background: var(--panel-row); transform: skewX(-12deg);
}
.tab.on { color: var(--ink); background: var(--paper); }
.row {
  display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 12px;
  padding: 8px 12px 8px 8px; background: var(--panel-row);
}
.row img, .card img { display: block; width: 100%; aspect-ratio: 1; max-width: 100%; }
.row.mine { box-shadow: inset 4px 0 0 var(--cash); }
.name { font-family: var(--score); font-size: 18px; line-height: 1.15; }
.sub { font-size: 14px; color: var(--dim); font-variant-numeric: tabular-nums; }
.tag { font-family: var(--score); font-size: 15px; color: var(--cash); white-space: nowrap; }
.tag.dim { color: var(--dim); }
.row .btn { font-size: 15px; padding: 7px 14px; white-space: nowrap; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.card { position: relative; display: grid; gap: 2px; padding: 8px; background: var(--panel-row); text-align: center; }
.card .name { font-size: 15px; }
.card .count { position: absolute; top: 6px; right: 8px; font-family: var(--score); font-size: 14px; }
.card.equipped { box-shadow: inset 0 0 0 3px var(--cash); }
.buttons { display: flex; gap: 12px; }
.buttons .btn { flex: 1; }
.reqs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.reqs li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; background: var(--panel-row); font-size: 16px; }
.reqs .ok { color: var(--cash); }
.reqs .no { color: var(--hot); }
.compare { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; text-align: center; }
.compare div { padding: 10px; background: var(--panel-row); }
.compare b { display: block; font-family: var(--score); font-size: 28px; color: var(--gold); }
.r0 { color: var(--common); }
.r1 { color: var(--uncommon); }
.r2 { color: var(--rare); }
.r3 { color: var(--epic); }
.r4 { color: var(--legendary); }

/* ---------- Egg hatching ---------- */
#hatch {
  position: fixed; inset: 0; display: grid; align-content: end; justify-items: center; gap: 6px; cursor: pointer;
  padding-bottom: calc(9vh + env(safe-area-inset-bottom, 0px));
}
body.hatching #hud-left, body.hatching #hud-right, body.hatching #help, body.hatching #bar, body.hatching #full, body.hatching #panel { visibility: hidden; }
#hatch-info { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 36px; min-height: 90px; padding-inline: 16px; }
.reveal { display: grid; justify-items: center; gap: 2px; animation: pop-in 0.4s ease-out both; }
.reveal .rarity { font-family: var(--score); font-size: 15px; letter-spacing: 0.2em; text-transform: uppercase; }
.reveal .pet-name { font-family: var(--display); font-size: clamp(22px, 3.4vw, 34px); paint-order: stroke fill; -webkit-text-stroke: 6px var(--ink); }
.reveal .sub { color: var(--paper); }
#hatch-hint { font-size: 15px; color: var(--dim); }
@keyframes pop-in { from { transform: scale(0.4); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  #full, .reveal { animation: none; }
  #toast, #fade { transition: none; }
  .pop { animation-name: fade; }
  @keyframes fade { from { transform: translate(-50%, -50%); opacity: 1; } to { transform: translate(-50%, -50%); opacity: 0; } }
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud-left">
  <div class="chip cash"><span class="badge">$</span><span id="cash">0</span></div>
  <div class="chip bag"><div id="bag-fill" class="fill"></div><span id="bag-text">0 / 20</span></div>
  <div class="chip small"><span>Bag worth <b id="bag-worth">$0</b> · Cash boost <b id="boost">x1</b></span></div>
</div>
<div id="hud-right">
  <div class="chip place"><span id="place-world"></span><span id="place-zone"></span></div>
  <button id="mute" class="icon-btn" type="button" aria-label="Turn sound off"></button>
</div>

<p id="help">WASD to move · Space to jump · Click to swing · Drag to look around · Scroll to zoom</p>
<div id="bar">
  <button id="auto" class="btn off" type="button">Auto Swing: Off</button>
  <button id="pets" class="btn" type="button">Pets</button>
  <button id="rebirth" class="btn gold" type="button">Rebirth</button>
</div>

<div id="toast"><div id="toast-kicker"></div><div id="toast-title"></div></div>
<div id="full" hidden>Bag full! Sell it on a green CASH pad.</div>
<div id="fx"></div>
<div id="panel" hidden></div>
<div id="hatch" hidden>
  <div id="hatch-info"></div>
  <div id="hatch-hint" hidden>Click to continue</div>
</div>
<div id="flash"></div>
<div id="fade"></div>
<div id="loading">Warming up the stadium<small>Building players, pets and worlds</small></div>

<script type="importmap">

  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">

import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

// =====================================================================
// Economy. Every price steps up 10x per tier/zone and income roughly 6x,
// so each zone takes longer than the last. A greedy-player simulation puts
// the full run (all 5 worlds and the Championship) at about 3.5 hours.
// =====================================================================

const TIERS = 15;
const PETS_EQUIPPED = 4;
const ballValue = zone => 3 ** zone;
const gearPower = tier => 2 ** tier;
const bagCapacity = tier => 20 * 2 ** tier;
const gearCost = tier => (tier === 0 ? 0 : 80 * 10 ** (tier - 1));
const bagCost = tier => (tier === 0 ? 0 : 100 * 10 ** (tier - 1));
const zoneCost = zone => 600 * 10 ** (zone - 1);
const eggCost = world => 150 * 300 ** world;
const rebirthCost = count => 50000 * 8 ** count;
const rebirthBoost = count => 1 + 0.5 * count;
const TROPHY_COST = zoneCost(15);

const RARITIES = [
  { name: "Common", chance: 60, bonus: 0.05 },
  { name: "Uncommon", chance: 25, bonus: 0.12 },
  { name: "Rare", chance: 10, bonus: 0.3 },
  { name: "Epic", chance: 4, bonus: 0.75 },
  { name: "Legendary", chance: 1, bonus: 2 },
];

const WORLDS = [
  { name: "Soccer Stadium", ball: "soccer", icon: "⚽", zones: ["Training Pitch", "Penalty Box", "Golden Goal"], rebirths: 0, egg: "Soccer Egg",
    accent: 0x3b82f6, kit: 0x2563eb, seats: 0x1e3a8a, wall: 0x1d4ed8, skyTop: 0x2f7fe0, skyLow: 0xc4e6ff },
  { name: "Basketball Arena", ball: "basketball", icon: "🏀", zones: ["Practice Court", "Three-Point Line", "Slam Dunk Zone"], rebirths: 1, egg: "Hoops Egg",
    accent: 0xf97316, kit: 0xdc2626, seats: 0x7f1d1d, wall: 0xb91c1c, skyTop: 0x4b63c9, skyLow: 0xffd6ae },
  { name: "Football Field", ball: "football", icon: "🏈", zones: ["Practice Field", "Midfield", "Hail Mary Zone"], rebirths: 3, egg: "Gridiron Egg",
    accent: 0x22c55e, kit: 0x15803d, seats: 0x14532d, wall: 0x166534, skyTop: 0x3a78d0, skyLow: 0xdcefff },
  { name: "Baseball Park", ball: "baseball", icon: "⚾", zones: ["Bullpen", "Infield", "Home Run Derby"], rebirths: 6, egg: "Diamond Egg",
    accent: 0xef4444, kit: 0x1e3a8a, seats: 0x1e3a8a, wall: 0x14532d, skyTop: 0x6a5acd, skyLow: 0xffc9b0 },
  { name: "Hockey Rink", ball: "puck", icon: "🏒", zones: ["Warm-Up Ice", "Blue Line", "Championship Ice"], rebirths: 10, egg: "Frost Egg",
    accent: 0x38bdf8, kit: 0x0f172a, seats: 0x0c4a6e, wall: 0xf1f5f9, skyTop: 0x1e3a8a, skyLow: 0xd3eaff },
];

const GEAR = [
  ["Foam Bat", "bat", "foam"], ["Wooden Bat", "bat", "wood"], ["Tennis Racket", "racket", "red"],
  ["Hockey Stick", "stick", "wood"], ["Golf Club", "club", "steel"], ["Aluminum Bat", "bat", "steel"],

  ["Titanium Club", "club", "titanium"], ["Golden Bat", "bat", "gold"], ["Golden Racket", "racket", "gold"],
  ["Diamond Bat", "bat", "diamond"], ["Diamond Stick", "stick", "diamond"], ["Champion Bat", "bat", "champion"],
].map(([name, type, finish], tier) => ({ name, type, finish, tier }));

const BAGS = [
  "Pocket Pouch", "Drawstring Bag", "Gym Bag", "Sports Backpack", "Duffel Bag", "Team Duffel", "Ball Bag", "Equipment Bag",
  "Pro Bag", "Titan Bag", "Golden Bag", "Platinum Bag", "Diamond Bag", "Legend Bag", "Champion Bag",
].map((name, tier) => ({ name, tier }));
const BAG_COLORS = [0x6b7280, 0x16a34a, 0x2563eb, 0xdc2626, 0x7c3aed, 0x0891b2, 0xea580c, 0x334155, 0xdb2777, 0x0f766e, 0xfbbf24, 0xe5e7eb, 0x67e8f9, 0xa855f7, 0xf0abfc];

const FINISH = {
  foam: { color: 0xfb923c, roughness: 0.9 },
  wood: { color: 0xc68642, roughness: 0.55 },
  red: { color: 0xef4444, roughness: 0.35, metalness: 0.2 },
  steel: { color: 0xd1d5db, roughness: 0.22, metalness: 0.9 },
  carbon: { color: 0x1f2937, roughness: 0.28, metalness: 0.5 },
  titanium: { color: 0x93c5fd, roughness: 0.2, metalness: 0.9 },
  gold: { color: 0xfbbf24, roughness: 0.18, metalness: 1 },
  diamond: { color: 0x67e8f9, roughness: 0.05, metalness: 0.2, emissive: 0x0891b2, emissiveIntensity: 0.6 },

// =====================================================================
// World layout. Every world shares it: a hub with pads, three zones running
// toward -z behind gates, and a portal at the far end.
// =====================================================================

const HALF = 30;
const BACK_Z = 34;
const END_Z = -94;
const ZONE_START = [14, -22, -58];
const PORTAL_Z = -86;
const SPAWN_Z = 21;
const PAD_RADIUS = 2.8;
const NODES_PER_ZONE = 12;
const NODE_KINDS = ["pile", "rack", "giant"];
const NODE_SPEC = {
  pile: { hits: 5, radius: 1.2 },

const sound = {
  ctx: null,

    if (!this.ctx) {

      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
      const length = this.ctx.sampleRate * 2;
      this.noiseBuffer = this.ctx.createBuffer(1, length, this.ctx.sampleRate);
      const data = this.noiseBuffer.getChannelData(0);
      for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
    }
    if (this.ctx.state === "suspended") this.ctx.resume();
  },
  envelope(node, { at, dur, vol, attack }) {
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.0001, at);
    gain.gain.exponentialRampToValueAtTime(vol, at + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    node.connect(gain).connect(this.master);
  },
  tone(freq, { type = "sine", dur = 0.15, vol = 0.25, to = freq, at = 0, attack = 0.005 } = {}) {
    const start = this.ctx.currentTime + at;
    const osc = this.ctx.createOscillator();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, start);
    osc.frequency.exponentialRampToValueAtTime(to, start + dur);
    this.envelope(osc, { at: start, dur, vol, attack });
    osc.start(start);
    osc.stop(start + dur + 0.05);
  },
  noise({ dur = 0.1, vol = 0.2, freq = 1200, to = freq, filter = "lowpass", q = 1, at = 0, attack = 0.005 } = {}) {
    const start = this.ctx.currentTime + at;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer;
    src.loop = true;
    const biquad = this.ctx.createBiquadFilter();
    biquad.type = filter;
    biquad.Q.value = q;
    biquad.frequency.setValueAtTime(freq, start);
    biquad.frequency.exponentialRampToValueAtTime(to, start + dur);
    src.connect(biquad);
    this.envelope(biquad, { at: start, dur, vol, attack });
    src.start(start, Math.random());
    src.stop(start + dur + 0.05);
  },
  play(name, arg) {
    if (!this.ctx || state.muted) return;
    SFX[name](this, arg);

};

// Adds a mesh to a parent. s is a uniform scale or [x, y, z]; r is a rotation [x, y, z].
function part(parent, geo, mat, p = [0, 0, 0], s = 1, r = [0, 0, 0]) {
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(...p);
  if (Array.isArray(s)) mesh.scale.set(...s);
  else mesh.scale.setScalar(s);
  mesh.rotation.set(...r);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

// Bakes a static model into one mesh per material, so it costs a few draw calls instead of dozens.
function mergeByMaterial(group) {
  group.updateMatrixWorld(true);
  const buckets = new Map();
  group.traverse(obj => {
    if (!obj.isMesh) return;
    const geo = (obj.geometry.index ? obj.geometry.toNonIndexed() : obj.geometry.clone()).applyMatrix4(obj.matrixWorld);
    if (!buckets.has(obj.material)) buckets.set(obj.material, []);
    buckets.get(obj.material).push(geo);
  });
  const out = new THREE.Group();
  for (const [material, geos] of buckets) {
    const mesh = new THREE.Mesh(mergeGeometries(geos), material);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    out.add(mesh);
    geos.forEach(g => g.dispose());
  }
  return out;
}

function eggProfile(from, to) {
  const pts = [];
  for (let i = 0; i <= 20; i++) {
    const t = from + ((to - from) * i) / 20;
    pts.push(new THREE.Vector2(Math.max(0.0001, Math.sin(t) * (0.46 + 0.05 * Math.cos(t))), -Math.cos(t) * 0.62));
  }
  return pts;
}
const EGG_SPLIT = Math.PI * 0.56;
const EGG_GEO = {
  bottom: new THREE.LatheGeometry(eggProfile(0, EGG_SPLIT), 40),
  top: new THREE.LatheGeometry(eggProfile(EGG_SPLIT, Math.PI), 40),
};
const eggTextures = {};
const eggMaterials = {};
function eggTexture(w) {
  const kind = WORLDS[w].ball;
  eggTextures[w] ??= kind === "puck"
    ? canvasTexture(256, 256, (g, wd, ht) => {
      g.fillStyle = "#bae6fd";
      g.fillRect(0, 0, wd, ht);
      g.strokeStyle = "#ffffff";
      g.lineWidth = 4;
      for (let i = 0; i < 14; i++) {
        const x = Math.random() * wd, y = Math.random() * ht, r = 8 + Math.random() * 10;
        for (let k = 0; k < 3; k++) {
          const a = (k / 3) * Math.PI;
          g.beginPath(); g.moveTo(x - Math.cos(a) * r, y - Math.sin(a) * r); g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); g.stroke();
        }
      }
    })
    : BALL_TEXTURES[kind]();
  return eggTextures[w];
}
// Egg as two halves so it can crack open.
function eggModel(w, ownMaterial) {
  const material = ownMaterial

// Text drawn onto a canvas, for signs and floating labels.
function signTexture(lines, { width = 1024, height = 256, accent = 0x3b82f6 } = {}) {
  return canvasTexture(width, height, (g, w, h) => {
    g.fillStyle = "#0a1430";
    g.fillRect(0, 0, w, h);
    g.fillStyle = hex(accent);
    g.fillRect(0, h - 18, w, 18);
    g.fillRect(0, 0, w, 6);
    const total = lines.reduce((s, l) => s + l.size * 1.15, 0);
    let y = (h - 18 - total) / 2;
    g.textAlign = "center";
    g.textBaseline = "top";
    for (const line of lines) {
      let size = line.size;
      g.font = `${size}px ${line.font ?? '"Russo One", sans-serif'}`;
      while (g.measureText(line.text).width > w - 60) { size -= 4; g.font = `${size}px ${line.font ?? '"Russo One", sans-serif'}`; }
      g.fillStyle = line.color ?? "#ffffff";
      g.fillText(line.text, w / 2, y + (line.size - size) / 2);
      y += line.size * 1.15;
    }
  });
}
function floatingLabel(text, color, width) {
  const tex = canvasTexture(512, 128, (g, w, h) => {
    let size = 78;
    do { size -= 4; g.font = `${size}px "Russo One", sans-serif`; } while (g.measureText(text).width > w - 40);
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.lineJoin = "round";
    g.lineWidth = 16;
    g.strokeStyle = "#0a1430";
    g.strokeText(text, w / 2, h / 2 + 4);
    g.fillStyle = color;
    g.fillText(text, w / 2, h / 2 + 4);
  });
  const sprite = new THREE.Sprite(own(new THREE.SpriteMaterial({ map: own(tex), depthWrite: false })));
  sprite.scale.set(width, width / 4, 1);
  return sprite;
}

// =====================================================================
// Particles: one instanced mesh of little cubes per scene
// =====================================================================

class Particles {
  constructor(parent, max = 400) {
    this.mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ roughness: 0.5, envMapIntensity: 0.8 }), max);
    this.mesh.frustumCulled = false;
    this.mesh.count = 0;
    this.max = max;
    this.items = [];
    this.dummy = new THREE.Object3D();
    this.color = new THREE.Color();
    parent.add(this.mesh);
  }
  burst(pos, { count = 12, colors = [0xffffff], speed = 5, up = 4, gravity = 14, life = 0.8, size = 0.15 } = {}) {
    for (let i = 0; i < count && this.items.length < this.max; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = speed * (0.4 + Math.random() * 0.6);
      this.items.push({
        p: pos.clone(),
        v: new THREE.Vector3(Math.cos(a) * s, up * (0.5 + Math.random()), Math.sin(a) * s),
        r: new THREE.Vector3(Math.random() * 6, Math.random() * 6, Math.random() * 6),
        spin: (Math.random() - 0.5) * 16,
        color: colors[Math.floor(Math.random() * colors.length)],
        life, age: 0, gravity, size: size * (0.6 + Math.random() * 0.8),
      });
    }
  }
  update(dt) {
    this.items = this.items.filter(it => (it.age += dt) < it.life);
    this.items.forEach((it, i) => {
      it.v.y -= it.gravity * dt;
      it.p.addScaledVector(it.v, dt);
      it.r.x += it.spin * dt;
      it.r.y += it.spin * dt;
      this.dummy.position.copy(it.p);
      this.dummy.rotation.set(it.r.x, it.r.y, it.r.z);
      this.dummy.scale.setScalar(it.size * (1 - (it.age / it.life) ** 2));
      this.dummy.updateMatrix();
      this.mesh.setMatrixAt(i, this.dummy.matrix);
      this.mesh.setColorAt(i, this.color.set(it.color));
    });
    this.mesh.count = this.items.length;
    this.mesh.instanceMatrix.needsUpdate = true;
    if (this.mesh.instanceColor) this.mesh.instanceColor.needsUpdate = true;
  }
}
const particles = new Particles(scene);

// =====================================================================
// World building
// =====================================================================

let world = null;
let worldOwned = [];
const own = thing => {
  worldOwned.push(thing);
  return thing;
};
const PPU = 16;
const FIELD_W = HALF * 2;
const FIELD_L = BACK_Z - END_Z;
const ZONE_CENTERS = ZONE_START.map((z, k) => (z + (ZONE_START[k + 1] ?? END_Z)) / 2);
const zoneAt = z => (z > ZONE_START[1] ? 0 : z > ZONE_START[2] ? 1 : 2);

function fieldTexture(def, rand) {
  return canvasTexture(FIELD_W * PPU, FIELD_L * PPU, (g, w, h) => {
    const X = x => (x + HALF) * PPU;
    const Y = z => (z - END_Z) * PPU;
    const U = u => u * PPU;
    const stroke = (width, color = "rgba(255,255,255,0.92)") => { g.strokeStyle = color; g.lineWidth = U(width); };
    const circle = (x, z, r, fill) => {
      g.beginPath();
      g.arc(X(x), Y(z), U(r), 0, Math.PI * 2);
      if (fill) { g.fillStyle = fill; g.fill(); } else g.stroke();
    };
    const lineAcross = z => { g.beginPath(); g.moveTo(X(-HALF + 1.5), Y(z)); g.lineTo(X(HALF - 1.5), Y(z)); g.stroke(); };
    const accent = hex(def.accent);
    switch (def.ball) {
      case "soccer": {
        g.fillStyle = "#3a9645";
        g.fillRect(0, 0, w, h);
        for (let i = 0; i * 4 < FIELD_L; i += 2) { g.fillStyle = "#43a650"; g.fillRect(0, U(i * 4), w, U(4)); }
        stroke(0.22);
        g.strokeRect(X(-HALF + 1.5), Y(END_Z + 1.5), U(FIELD_W - 3), U(FIELD_L - 3));
        for (const zc of ZONE_CENTERS) { circle(0, zc, 7); lineAcross(zc); circle(0, zc, 0.45, "#ffffff"); }
        for (const zg of ZONE_START.slice(1)) {
          g.strokeRect(X(-14), Y(zg), U(28), U(10));
          g.strokeRect(X(-14), Y(zg - 10), U(28), U(10));
          g.strokeRect(X(-6), Y(zg), U(12), U(4));
          g.strokeRect(X(-6), Y(zg - 4), U(12), U(4));
        }
        break;
      }
      case "basketball": {
        for (let x = -HALF; x < HALF; x += 0.8) {
          g.fillStyle = `hsl(31, 58%, ${50 + rand() * 9}%)`;
          g.fillRect(X(x), 0, U(0.8), h);
          g.fillStyle = "rgba(70,35,10,0.35)";
          g.fillRect(X(x), 0, U(0.05), h);
          for (let z = END_Z + rand() * 6; z < BACK_Z; z += 4 + rand() * 6) g.fillRect(X(x), Y(z), U(0.8), U(0.05));
        }
        stroke(0.22);
        g.strokeRect(X(-HALF + 1.5), Y(END_Z + 1.5), U(FIELD_W - 3), U(FIELD_L - 3));
        for (const zc of ZONE_CENTERS) { circle(0, zc, 5, accent); circle(0, zc, 5); lineAcross(zc); }
        for (const zg of ZONE_START.slice(1)) {
          for (const dir of [1, -1]) {
            g.fillStyle = accent;
            g.globalAlpha = 0.8;
            g.fillRect(X(-6), dir > 0 ? Y(zg) : Y(zg - 14), U(12), U(14));
            g.globalAlpha = 1;
            g.strokeRect(X(-6), dir > 0 ? Y(zg) : Y(zg - 14), U(12), U(14));
            circle(0, zg + dir * 14, 4);
            g.beginPath();
            g.arc(X(0), Y(zg), U(17), dir > 0 ? 0 : Math.PI, dir > 0 ? Math.PI : Math.PI * 2);
            g.stroke();
          }
        }
        break;
      }
      case "football": {
        for (let i = 0; i * 5 < FIELD_L; i++) { g.fillStyle = i % 2 ? "#3c9a44" : "#46a84f"; g.fillRect(0, U(i * 5), w, U(5)); }
        g.fillStyle = accent;
        g.fillRect(X(-HALF + 1.5), Y(ZONE_START[0]), U(FIELD_W - 3), U(BACK_Z - ZONE_START[0] - 1.5));
        g.save();
        g.translate(X(0), Y((BACK_Z + ZONE_START[0]) / 2));
        g.font = `${U(5)}px "Graduate", serif`;
        g.textAlign = "center";
        g.textBaseline = "middle";
        g.fillStyle = "rgba(255,255,255,0.9)";
        g.fillText("LEGENDS", 0, 0);
        g.restore();
        stroke(0.25);
        g.strokeRect(X(-HALF + 1.5), Y(END_Z + 1.5), U(FIELD_W - 3), U(FIELD_L - 3));
        g.font = `${U(3)}px "Russo One", sans-serif`;
        g.textAlign = "center";
        g.textBaseline = "middle";
        g.fillStyle = "rgba(255,255,255,0.9)";
        for (let z = ZONE_START[0], yard = 0; z > END_Z + 2; z -= 5, yard += 5) {
          lineAcross(z);
          if (yard % 10 === 0 && yard > 0 && yard < 100) for (const x of [-21, 21]) g.fillText(String(yard <= 50 ? yard : 100 - yard), X(x), Y(z) - U(2.2));
          for (let k = 1; k < 5; k++) for (const x of [-7, 7]) g.fillRect(X(x - 0.5), Y(z - k), U(1), U(0.15));
        }
        break;
      }
      case "baseball": {
        for (let i = 0; i * 4 < FIELD_W; i++) for (let j = 0; j * 4 < FIELD_L; j++) {
          g.fillStyle = (i + j) % 2 ? "#3f9a47" : "#47a651";
          g.fillRect(U(i * 4), U(j * 4), U(4), U(4));
        }
        for (const zc of ZONE_CENTERS) {
          g.save();
          g.translate(X(0), Y(zc));
          g.rotate(Math.PI / 4);
          g.fillStyle = "#c98b55";
          g.fillRect(-U(8.5), -U(8.5), U(17), U(17));
          g.fillStyle = "#3f9a47";
          g.fillRect(-U(6.2), -U(6.2), U(12.4), U(12.4));
          g.fillStyle = "#ffffff";
          for (const [bx, by] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) g.fillRect(U(bx * 7.35) - U(0.6), U(by * 7.35) - U(0.6), U(1.2), U(1.2));
          g.restore();
          circle(0, zc, 1.8, "#c98b55");
          g.fillStyle = "#ffffff";
          g.fillRect(X(-0.6), Y(zc) - U(0.12), U(1.2), U(0.24));
        }
        stroke(0.25);
        g.strokeRect(X(-HALF + 1.5), Y(END_Z + 1.5), U(FIELD_W - 3), U(FIELD_L - 3));
        break;
      }
      case "puck": {
        g.fillStyle = "#eef7fc";
        g.fillRect(0, 0, w, h);
        for (let i = 0; i < 500; i++) {
          g.strokeStyle = `rgba(150,180,200,${rand() * 0.25})`;
          g.lineWidth = 1 + rand() * 2;
          const x = rand() * w, y = rand() * h, a = rand() * Math.PI;
          g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * 60, y + Math.sin(a) * 60); g.stroke();
        }
        for (const zc of ZONE_CENTERS) {
          stroke(0.6, "#dc2626");
          lineAcross(zc);
          stroke(0.6, "#2563eb");
          lineAcross(zc + 8);
          lineAcross(zc - 8);
          stroke(0.2, "#2563eb");
          circle(0, zc, 4.5);
          stroke(0.2, "#dc2626");
          for (const x of [-13, 13]) for (const dz of [-13, 13]) { circle(x, zc + dz, 4); circle(x, zc + dz, 0.5, "#dc2626"); }
        }
        for (const zg of ZONE_START.slice(1)) for (const dir of [1, -1]) {
          g.fillStyle = "rgba(96,165,250,0.45)";
          g.beginPath();
          g.arc(X(0), Y(zg), U(3.5), dir > 0 ? 0 : Math.PI, dir > 0 ? Math.PI : Math.PI * 2);
          g.fill();
        }
        stroke(0.3, "#dc2626");
        g.strokeRect(X(-HALF + 1.5), Y(END_Z + 1.5), U(FIELD_W - 3), U(FIELD_L - 3));
        break;
      }
    }
  });
}

function adTexture(def) {
  const tex = canvasTexture(1024, 64, (g, w, h) => {
    g.fillStyle = hex(def.accent);
    g.fillRect(0, 0, w, h);
    g.font = '40px "Russo One", sans-serif';
    g.textBaseline = "middle";
    g.fillStyle = "#ffffff";
    g.fillText(`SPORTS LEGENDS  ★  ${def.name.toUpperCase()}  ★`, 16, h / 2 + 2);
  });
  tex.wrapS = THREE.RepeatWrapping;
  return tex;
}

function stripesTexture(color) {
  const tex = canvasTexture(128, 128, (g, w, h) => {
    g.fillStyle = hex(color);
    for (let i = -2; i < 4; i++) {
      g.beginPath();
      g.moveTo(i * 64, h); g.lineTo(i * 64 + 32, h); g.lineTo(i * 64 + 32 + h, 0); g.lineTo(i * 64 + h, 0);
      g.fill();
    }
  });
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function netTexture() {
  const tex = canvasTexture(128, 128, (g, w, h) => {
    g.strokeStyle = "#ffffff";
    g.lineWidth = 3;
    for (let i = 0; i <= 8; i++) {
      g.beginPath(); g.moveTo(i * 16, 0); g.lineTo(i * 16, h); g.stroke();
      g.beginPath(); g.moveTo(0, i * 16); g.lineTo(w, i * 16); g.stroke();
    }
  });
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3, 2);
  return tex;
}

function signBoard(lines, width, height, accent) {
  const g = new THREE.Group();
  part(g, own(new RoundedBoxGeometry(width + 0.4, height + 0.4, 0.3, 2, 0.1)), std(0x0a1430, { roughness: 0.4 }), [0, 0, 0]);
  const face = new THREE.Mesh(
    own(new THREE.PlaneGeometry(width, height)),
    own(new THREE.MeshBasicMaterial({ map: own(signTexture(lines, { width: 1024, height: Math.round((1024 * height) / width), accent })), toneMapped: false })),
  );
  face.position.z = 0.16;
  g.add(face);
  return g;
}

function booth(color, label) {
  const g = new THREE.Group();
  const white = std(0xf8fafc, { roughness: 0.4 });
  const tint = std(color, { roughness: 0.4 });
  part(g, own(new RoundedBoxGeometry(4.2, 1.2, 1.4, 2, 0.12)), white, [0, 0.6, 0]);
  part(g, GEO.box, tint, [0, 0.6, 0.71], [4, 0.9, 0.02]);
  for (const x of [-1.95, 1.95]) part(g, GEO.cyl, white, [x, 1.9, -0.3], [0.08, 3.6, 0.08]);
  const awning = part(g, GEO.box, own(new THREE.MeshStandardMaterial({ map: own(stripesTexture(color)), color: 0xffffff, roughness: 0.6 })), [0, 3.5, 0.2], [4.6, 0.2, 2.2], [0.18, 0, 0]);
  awning.material.map.repeat.set(4, 1);
  const sign = signBoard([{ text: label, size: 120 }], 4, 1, color);
  sign.position.set(0, 4.35, -0.3);
  g.add(sign);
  return g;
}

function prop(def) {
  const g = new THREE.Group();
  const white = std(0xf8fafc, { roughness: 0.35 });

  switch (def.ball) {
    case "soccer":
      for (const x of [-3.6, 3.6]) part(g, GEO.cyl, white, [x, 1.2, 0], [0.12, 2.4, 0.12]);
      part(g, GEO.cyl, white, [0, 2.4, 0], [0.12, 7.4, 0.12], [0, 0, Math.PI / 2]);
      part(g, GEO.box, net, [0, 1.2, -1.2], [7.2, 2.4, 0.02]);
      part(g, GEO.box, net, [0, 2.4, -0.6], [7.2, 0.02, 1.2]);
      for (const x of [-3.6, 3.6]) part(g, GEO.box, net, [x, 1.2, -0.6], [0.02, 2.4, 1.2]);
      break;
    case "basketball":
      part(g, GEO.cyl, std(0x6b7280, { metalness: 0.7, roughness: 0.3 }), [0, 2.6, -1.4], [0.15, 5.2, 0.15]);
      part(g, GEO.box, std(0x6b7280, { metalness: 0.7, roughness: 0.3 }), [0, 4.6, -0.9], [0.15, 0.15, 1.1]);
      part(g, GEO.box, white, [0, 4.9, -0.3], [2.2, 1.4, 0.08]);
      part(g, GEO.box, std(0xdc2626), [0, 4.65, -0.25], [0.7, 0.5, 0.02]);
      part(g, GEO.torus, std(0xf97316, { metalness: 0.5, roughness: 0.3 }), [0, 4.3, 0.15], [0.38, 0.38, 2], [Math.PI / 2, 0, 0]);
      part(g, own(new THREE.CylinderGeometry(0.38, 0.25, 0.6, 16, 1, true)), net, [0, 4.0, 0.15]);
      break;
    case "football": {
      const yellow = std(0xfacc15, { roughness: 0.35, metalness: 0.2 });
      part(g, GEO.cyl, yellow, [0, 1.8, -0.8], [0.18, 3.6, 0.18]);
      part(g, GEO.cyl, yellow, [0, 3.0, -0.4], [0.15, 0.9, 0.15], [Math.PI / 2, 0, 0]);
      part(g, GEO.cyl, yellow, [0, 3.6, 0], [0.15, 5.6, 0.15], [0, 0, Math.PI / 2]);
      for (const x of [-2.8, 2.8]) part(g, GEO.cyl, yellow, [x, 6.6, 0], [0.13, 6, 0.13]);
      break;
    }
    case "baseball": {
      const yellow = std(0xfacc15, { roughness: 0.35, metalness: 0.2 });
      part(g, GEO.cyl, yellow, [0, 6, 0], [0.2, 12, 0.2]);
      part(g, GEO.box, net, [0.7, 7, 0], [1.2, 8, 0.02]);
      part(g, GEO.cyl, std(0x6b7280), [0, 0.15, 0], [0.5, 0.3, 0.5]);
      break;
    }
    case "puck": {
      const red = std(0xdc2626, { roughness: 0.3, metalness: 0.4 });
      for (const x of [-1.8, 1.8]) part(g, GEO.cyl, red, [x, 0.6, 0], [0.08, 1.2, 0.08]);
      part(g, GEO.cyl, red, [0, 1.2, 0], [0.08, 3.6, 0.08], [0, 0, Math.PI / 2]);
      part(g, GEO.box, net, [0, 0.6, -0.9], [3.6, 1.2, 0.02]);
      part(g, GEO.box, net, [0, 1.2, -0.45], [3.6, 0.02, 0.9]);
      for (const x of [-1.8, 1.8]) part(g, GEO.box, net, [x, 0.6, -0.45], [0.02, 1.2, 0.9]);
      break;
    }
  }
  return g;
}

function buildCrowd(root, def, rand) {
  const fans = [];
  const shirts = [def.accent, def.kit, 0xffffff, 0xfacc15, def.accent, 0x111827];
  const skins = [0xf1c27d, 0xe0ac69, 0xc68642, 0x8d5524, 0xffdbac];
  const steps = 6;
  for (const side of [-1, 1]) {
    for (let s = 0; s < steps; s++) {
      const height = 1.4 + s * 1.05;
      const x = side * (HALF + 3.4 + s * 2.2);
      const step = part(root, GEO.box, flat(s % 2 ? def.seats : new THREE.Color(def.seats).offsetHSL(0, 0, 0.06).getHex()), [x, height / 2, (BACK_Z + END_Z) / 2], [2.2, height, FIELD_L + 4]);
      step.castShadow = false;
      for (let z = BACK_Z; z > END_Z; z -= 1.25) {
        if (rand() < 0.15) continue;
        fans.push({ x: x + (rand() - 0.5) * 0.4, y: height, z: z + (rand() - 0.5) * 0.3, phase: rand() * Math.PI * 2, shirt: shirts[Math.floor(rand() * shirts.length)], skin: skins[Math.floor(rand() * skins.length)] });
      }
    }
    part(root, GEO.box, flat(0x4b5563), [side * (HALF + 3.4 + steps * 2.2 + 0.5), 5.5, (BACK_Z + END_Z) / 2], [1, 11, FIELD_L + 4]).castShadow = false;
  }
  const bodies = own(new THREE.InstancedMesh(own(new THREE.CylinderGeometry(0.26, 0.32, 0.95, 6)), flat(0xffffff), fans.length));
  const heads = own(new THREE.InstancedMesh(own(new THREE.SphereGeometry(1, 6, 4)), flat(0xffffff), fans.length));
  const color = new THREE.Color();
  fans.forEach((fan, i) => {
    bodies.setColorAt(i, color.set(fan.shirt));
    heads.setColorAt(i, color.set(fan.skin));
  });
  root.add(bodies, heads);
  const crowd = { fans, bodies, heads, dummy: new THREE.Object3D() };
  updateCrowd(crowd, 0, 0);
  return crowd;
}

function updateCrowd(crowd, time, hype) {
  const { fans, bodies, heads, dummy } = crowd;
  const speed = 5 + hype * 6;
  const height = 0.06 + hype * 0.55;
  fans.forEach((fan, i) => {
    const bounce = Math.max(0, Math.sin(time * speed + fan.phase)) * height;
    dummy.position.set(fan.x, fan.y + 0.55 + bounce, fan.z);
    dummy.scale.setScalar(1);
    dummy.updateMatrix();
    bodies.setMatrixAt(i, dummy.matrix);
    dummy.position.y += 0.62;
    dummy.scale.setScalar(0.24);
    dummy.updateMatrix();
    heads.setMatrixAt(i, dummy.matrix);
  });
  bodies.instanceMatrix.needsUpdate = true;
  heads.instanceMatrix.needsUpdate = true;
}

function swirlMaterial(color) {
  return new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    uniforms: { time: { value: 0 }, color: { value: new THREE.Color(color) } },
    vertexShader: `
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform float time;
      uniform vec3 color;
      varying vec2 vUv;
      void main() {
        vec2 p = vUv - 0.5;
        float r = length(p) * 2.0;
        float a = atan(p.y, p.x);
        float s = sin(a * 4.0 + r * 12.0 - time * 5.0);
        vec3 c = mix(color, vec3(1.0), 0.35 + 0.35 * s);
        gl_FragColor = vec4(c, smoothstep(1.0, 0.2, r) * (0.75 + 0.25 * s));
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
  });
}

function trophyModel() {
  const g = new THREE.Group();
  const gold = std(0xfbbf24, { metalness: 1, roughness: 0.18, emissive: 0x92400e, emissiveIntensity: 0.25 });
  const cup = [[0.05, 0], [0.9, 0.05], [0.9, 0.35], [0.35, 0.45], [0.25, 0.9], [0.3, 1.2], [1.0, 1.7], [1.3, 2.8], [1.25, 2.9]]
    .map(([x, y]) => new THREE.Vector2(x, y));
  part(g, own(new THREE.LatheGeometry(cup, 40)), gold, [0, 0.8, 0]);
  for (const side of [-1, 1]) part(g, GEO.torus, gold, [side * 1.35, 3.0, 0], [0.55, 0.55, 2.2], [0, 0, side * 0.3]);
  part(g, own(new RoundedBoxGeometry(2.4, 0.8, 2.4, 2, 0.1)), std(0x111827, { roughness: 0.3, metalness: 0.4 }), [0, 0.4, 0]);
  return g;
}

function buildWorld(w) {
  if (world) {
    scene.remove(world.root);
    worldOwned.forEach(thing => thing.dispose());
    worldOwned = [];
  }
  const def = WORLDS[w];
  const rand = mulberry32(1000 + w);
  const root = new THREE.Group();
  scene.add(root);
  document.documentElement.style.setProperty("--accent", hex(def.accent));
  sky.material.uniforms.top.value.set(def.skyTop);
  sky.material.uniforms.low.value.set(def.skyLow);
  scene.fog.color.set(def.skyLow);

  const outside = part(root, own(new THREE.PlaneGeometry(900, 900)), flat(0x5b6170), [0, -0.05, 0], 1, [-Math.PI / 2, 0, 0]);
  outside.castShadow = false;
  const fieldTex = own(fieldTexture(def, rand));
  const field = part(root, own(new THREE.PlaneGeometry(FIELD_W, FIELD_L)), own(new THREE.MeshStandardMaterial({
    map: fieldTex, roughness: def.ball === "puck" ? 0.12 : def.ball === "basketball" ? 0.35 : 0.85, envMapIntensity: def.ball === "puck" ? 1 : 0.5,
  })), [0, 0, (BACK_Z + END_Z) / 2], 1, [-Math.PI / 2, 0, 0]);
  field.castShadow = false;

  const wallMat = std(def.wall, { roughness: 0.4 });
  const adMat = own(new THREE.MeshBasicMaterial({ map: own(adTexture(def)), toneMapped: false }));
  adMat.map.repeat.set(FIELD_L / 30, 1);
  for (const side of [-1, 1]) {
    part(root, GEO.box, wallMat, [side * (HALF + 0.5), 0.7, (BACK_Z + END_Z) / 2], [1, 1.4, FIELD_L]);
    const ad = new THREE.Mesh(own(new THREE.PlaneGeometry(FIELD_L, 0.9)), adMat);
    ad.position.set(side * (HALF - 0.01), 0.75, (BACK_Z + END_Z) / 2);
    ad.rotation.y = side * -Math.PI / 2;
    root.add(ad);
  }
  for (const z of [BACK_Z + 0.5, END_Z - 0.5]) part(root, GEO.box, wallMat, [0, 0.7, z], [FIELD_W + 2, 1.4, 1]);

  const crowd = buildCrowd(root, def, rand);

  for (const [x, z] of [[-1, BACK_Z - 4], [1, BACK_Z - 4], [-1, END_Z + 8], [1, END_Z + 8]]) {
    const towerX = x * (HALF + 20);
    part(root, GEO.cyl, std(0x9ca3af, { metalness: 0.8, roughness: 0.3 }), [towerX, 14, z], [0.5, 28, 0.5]).castShadow = false;
    part(root, GEO.box, std(0xffffff, { emissive: 0xfff7d6, emissiveIntensity: 2 }), [towerX, 28.5, z], [6, 3, 0.6], [0, x * 0.5, 0]).castShadow = false;
  }
  const board = signBoard([
    { text: "SPORTS LEGENDS", size: 70, color: hex(def.accent) },
    { text: def.name.toUpperCase(), size: 130, font: '"Graduate", serif' },
    { text: `WORLD ${w + 1} OF ${WORLDS.length}`, size: 60, color: "#fbbf24" },
  ], 34, 13, def.accent);
  board.position.set(0, 20, END_Z - 18);
  root.add(board);
  part(root, GEO.box, std(0x374151, { metalness: 0.6, roughness: 0.4 }), [0, 7, END_Z - 18.4], [2, 14, 1]).castShadow = false;

  for (const side of [-1, 1]) {
    const p = prop(def);
    p.position.set(side * 25.5, 0, 30);
    p.rotation.y = side * -Math.PI / 2;
    root.add(p);
  }

  const pads = PADS.map(pad => {
    const style = PAD_STYLE[pad.kind];
    const disc = part(root, GEO.cyl, std(style.color, { emissive: style.color, emissiveIntensity: 0.45, roughness: 0.3 }), [pad.x, 0.06, pad.z], [PAD_RADIUS, 0.12, PAD_RADIUS]);
    disc.castShadow = false;
    part(root, GEO.torus, std(0xffffff, { emissive: 0xffffff, emissiveIntensity: 0.6 }), [pad.x, 0.13, pad.z], [PAD_RADIUS, PAD_RADIUS, 1.2], [Math.PI / 2, 0, 0]).castShadow = false;
    const label = floatingLabel(style.label, "#ffffff", 6.5);
    label.position.set(pad.x, 3.6, pad.z);
    label.material.transparent = true;
    root.add(label);
    const side = Math.sign(pad.booth[0]);
    let model;
    if (pad.kind === "egg") {
      model = new THREE.Group();
      part(model, GEO.cyl, std(0x1f2937, { metalness: 0.5, roughness: 0.3 }), [0, 0.6, 0], [1.3, 1.2, 1.3]);
      part(model, GEO.torus, std(style.color, { emissive: style.color, emissiveIntensity: 0.6 }), [0, 1.2, 0], [1.3, 1.3, 1.5], [Math.PI / 2, 0, 0]);
      const egg = eggModel(w, false).group;
      egg.scale.setScalar(2.4);
      egg.position.y = 1.3;
      model.add(egg);
      model.userData.egg = egg;
    } else if (pad.kind === "travel") {
      model = new THREE.Group();
      part(model, GEO.torus, std(style.color, { metalness: 0.7, roughness: 0.25 }), [0, 2.4, 0], [2, 2, 3]);
      const swirl = new THREE.Mesh(own(new THREE.CircleGeometry(1.9, 40)), own(swirlMaterial(style.color)));
      swirl.position.y = 2.4;
      model.add(swirl);
      model.userData.swirl = swirl;
    } else {
      model = booth(style.color, style.label);
    }
    model.position.set(pad.booth[0], 0, pad.booth[1]);
    model.rotation.y = side * -Math.PI / 2;
    root.add(model);
    return { ...pad, model, label };
  });

  const nodes = [];
  for (let k = 0; k < 3; k++) {
    const kind = NODE_KINDS[k];
    const zTop = k === 0 ? 9 : ZONE_START[k] - 4;
    const zBottom = k === 2 ? PORTAL_Z + 7 : (ZONE_START[k + 1] ?? END_Z) + 3;
    let placed = 0;
    for (let tries = 0; placed < NODES_PER_ZONE; tries++) {
      if (tries > 4000) throw new Error(`Could not fit ${NODES_PER_ZONE} nodes in zone ${k} of ${def.name}`);
      const x = (rand() * 2 - 1) * (HALF - 4);
      const z = zBottom + rand() * (zTop - zBottom);
      if (nodes.some(n => Math.hypot(n.x - x, n.z - z) < 5.6)) continue;
      if (PADS.some(p => Math.hypot(p.x - x, p.z - z) < 6.5 || Math.hypot(p.booth[0] - x, p.booth[1] - z) < 5)) continue;
      const group = nodeModel(def, kind, rand);
      group.position.set(x, 0, z);
      group.rotation.y = rand() * Math.PI * 2;
      group.traverse(o => { if (o.isMesh) own(o.geometry); });
      root.add(group);
      nodes.push({ k, kind, x, z, radius: NODE_SPEC[kind].radius, hits: NODE_SPEC[kind].hits, respawn: 0, punch: 0, grow: 1, group });
      placed++;
    }
  }

  const gateMat = own(new THREE.MeshBasicMaterial({ map: own(stripesTexture(def.accent)), color: 0xffffff, transparent: true, opacity: 0.6, side: THREE.DoubleSide, depthWrite: false, toneMapped: false }));
  gateMat.map.repeat.set(FIELD_W / 6, 7 / 6);
  const gates = [];
  for (let k = 1; k < 3; k++) {
    const zone = zoneIndex(w, k);
    if (state.zones > zone) continue;
    const group = new THREE.Group();
    group.position.z = ZONE_START[k];
    const fieldWall = new THREE.Mesh(own(new THREE.PlaneGeometry(FIELD_W, 7)), gateMat);
    fieldWall.position.y = 3.5;
    group.add(fieldWall);
    for (const side of [-1, 1]) part(group, GEO.box, std(def.accent, { metalness: 0.6, roughness: 0.3 }), [side * HALF, 4.5, 0], [0.9, 9, 0.9]);
    const sign = signBoard([
      { text: `LOCKED · ZONE ${k + 1}`, size: 54, color: hex(def.accent) },
      { text: def.zones[k], size: 92 },
      { text: money(zoneCost(zone)), size: 78, color: "#fbbf24" },
    ], 13, 4.6, def.accent);
    sign.position.y = 9.8;
    group.add(sign);
    group.visible = k === openZonesHere();
    root.add(group);
    gates.push({ k, group, sinking: -1 });
  }

  const portal = new THREE.Group();
  portal.position.set(0, 0, PORTAL_Z);
  part(portal, GEO.cyl, std(0x1f2937, { metalness: 0.6, roughness: 0.3 }), [0, 0.2, 0], [5, 0.4, 5]).castShadow = false;
  part(portal, GEO.torus, std(def.accent, { emissive: def.accent, emissiveIntensity: 0.8 }), [0, 0.42, 0], [5, 5, 1.2], [Math.PI / 2, 0, 0]).castShadow = false;
  let swirl = null;
  let trophy = null;
  if (w < WORLDS.length - 1) {
    const next = WORLDS[w + 1];
    part(portal, GEO.torus, std(next.accent, { metalness: 0.8, roughness: 0.2 }), [0, 4.8, 0], [4.2, 4.2, 4.5]);
    swirl = new THREE.Mesh(own(new THREE.CircleGeometry(4, 48)), own(swirlMaterial(next.accent)));
    swirl.position.y = 4.8;
    portal.add(swirl);
    const sign = signBoard([
      { text: `WORLD ${w + 2}`, size: 54, color: hex(next.accent) },
      { text: next.name, size: 92 },
      { text: `${money(zoneCost(zoneIndex(w + 1, 0)))} · ${next.rebirths} rebirth${next.rebirths === 1 ? "" : "s"}`, size: 66, color: "#fbbf24" },
    ], 13, 4.6, next.accent);
    sign.position.y = 11.6;
    portal.add(sign);
  } else {
    trophy = trophyModel();
    trophy.scale.setScalar(1.4);
    trophy.position.y = 0.4;
    portal.add(trophy);
    const sign = signBoard([
      { text: "THE CHAMPIONSHIP", size: 70, color: "#fbbf24" },
      { text: "Win the Trophy", size: 92 },
      { text: money(TROPHY_COST), size: 72, color: "#fbbf24" },
    ], 13, 4.6, 0xfbbf24);
    sign.position.y = 11.6;
    portal.add(sign);
  }
  portal.visible = openZonesHere() === 3;
  root.add(portal);

  const flyerPool = [];
  for (let i = 0; i < 18; i++) {
    const mesh = new THREE.Group();
    addBall(mesh, def.ball, [0, 0, 0], def.ball === "puck" ? 0.22 : 0.2, rand);
    mesh.visible = false;
    root.add(mesh);
    flyerPool.push(mesh);
  }

  world = { index: w, def, root, nodes, gates, portal, swirl, trophy, pads, crowd, flyerPool, flyers: [], gateMat, hype: 0 };
}

// =====================================================================
// Player movement, animation and swinging
// =====================================================================

let player;
const keys = new Set();
const GAME_KEYS = new Set(["KeyW", "KeyA", "KeyS", "KeyD", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"]);
addEventListener("keydown", e => {
  sound.unlock();
  if (!GAME_KEYS.has(e.code)) return;
  e.preventDefault();
  keys.add(e.code);
});
addEventListener("keyup", e => keys.delete(e.code));
addEventListener("blur", () => keys.clear());
const held = (...codes) => codes.some(code => keys.has(code));

const minZ = () => (openZonesHere() < 3 ? ZONE_START[openZonesHere()] + 0.9 : END_Z + 0.9);

function updatePlayer(dt) {
  const P = player;
  const p = P.root.position;
  const forward = held("KeyW", "ArrowUp") - held("KeyS", "ArrowDown");
  const strafe = held("KeyD", "ArrowRight") - held("KeyA", "ArrowLeft");
  const fx = -Math.sin(cam.yaw);
  const fz = -Math.cos(cam.yaw);
  let mx = fx * forward - fz * strafe;
  let mz = fz * forward + fx * strafe;
  const len = Math.hypot(mx, mz);
  if (len > 0) { mx /= len; mz /= len; }
  P.velocity.x = damp(P.velocity.x, mx * SPEED, 12, dt);
  P.velocity.z = damp(P.velocity.z, mz * SPEED, 12, dt);
  p.x += P.velocity.x * dt;
  p.z += P.velocity.z * dt;
  const speed = Math.hypot(P.velocity.x, P.velocity.z);
  const moving = speed > 1;
  if (len > 0 && P.swingT >= 1) P.facing = Math.atan2(mx, mz);

  const grounded = p.y === 0;
  if (held("Space") && grounded) {
    P.velocity.y = JUMP;
    sound.play("jump");
  }
  P.velocity.y -= GRAVITY * dt;
  p.y = Math.max(0, p.y + P.velocity.y * dt);
  if (p.y === 0) {
    if (!grounded && P.velocity.y < -8) {
      P.land = 1;
      sound.play("land");
      particles.burst(new THREE.Vector3(p.x, 0.1, p.z), { count: 10, colors: [0xd6d3d1, 0xa8a29e], speed: 4, up: 1.5, gravity: 4, life: 0.5, size: 0.18 });
    }
    P.velocity.y = 0;
  }

  for (const n of world.nodes) {
    if (n.respawn > 0) continue;
    const dx = p.x - n.x;
    const dz = p.z - n.z;
    const d = Math.hypot(dx, dz);
    const min = n.radius + 0.6;
    if (d < min && d > 0) {
      p.x = n.x + (dx / d) * min;
      p.z = n.z + (dz / d) * min;
    }
  }
  p.x = clamp(p.x, -HALF + 0.9, HALF - 0.9);
  p.z = clamp(p.z, minZ(), BACK_Z - 0.9);

  const turn = Math.atan2(Math.sin(P.facing - P.body.rotation.y), Math.cos(P.facing - P.body.rotation.y));
  P.body.rotation.y += turn * (1 - Math.exp(-dt * 14));
  animatePlayer(dt, moving, p.y > 0, speed);
}

function animatePlayer(dt, moving, airborne, speed) {
  const P = player;
  P.run = damp(P.run, moving && !airborne ? 1 : 0, 10, dt);
  P.air = damp(P.air, airborne ? 1 : 0, 14, dt);
  P.land = Math.max(0, P.land - dt * 5);
  P.phase += dt * speed * 0.85;
  const s = Math.sin(P.phase);
  const c = Math.cos(P.phase);
  const breathe = Math.sin(clock * 2.2);
  const { run, air } = P;

  if (moving && !airborne && Math.floor(P.phase / Math.PI) !== P.lastStep) {
    P.lastStep = Math.floor(P.phase / Math.PI);
    sound.play("step");
  }

  P.legL.hip.rotation.x = -s * 0.75 * run - 0.7 * air;
  P.legR.hip.rotation.x = s * 0.75 * run - 0.2 * air;
  P.legL.knee.rotation.x = run * (0.15 + Math.max(0, c) * 1.1) + 1.1 * air;
  P.legR.knee.rotation.x = run * (0.15 + Math.max(0, -c) * 1.1) + 0.5 * air;
  for (const [a, swingSign, side] of [[P.armL, 1, -1], [P.armR, -1, 1]]) {
    a.shoulder.rotation.x = swingSign * s * 0.7 * run + breathe * 0.03 - 1.0 * air;
    a.shoulder.rotation.z = side * (0.08 + 0.55 * air);
    a.elbow.rotation.x = -(0.25 + 0.55 * run);
  }
  P.torso.rotation.x = 0.12 * run;
  P.torso.rotation.y = s * 0.1 * run;
  P.torso.scale.y = 1 + breathe * 0.012 * (1 - run);
  P.hips.position.y = 1.0 + Math.abs(c) * 0.07 * run - P.land * 0.18;
  P.hips.rotation.y = -s * 0.08 * run;
  P.neck.rotation.x = -0.1 * run;

  P.swingT = Math.min(1, P.swingT + dt / SWING_TIME);
  if (P.swingT < 1) {
    const t = P.swingT;
    let shoulder, twist, elbow;
    if (t < 0.3) {
      const k = smooth(t / 0.3);
      shoulder = lerp(-0.3, -2.8, k); twist = lerp(0, 0.6, k); elbow = lerp(-0.5, -0.9, k);
    } else if (t < 0.55) {
      const k = smooth((t - 0.3) / 0.25);
      shoulder = lerp(-2.8, -0.25, k); twist = lerp(0.6, -0.55, k); elbow = lerp(-0.9, -0.1, k);
    } else {
      const k = smooth((t - 0.55) / 0.45);
      shoulder = lerp(-0.25, -0.3, k); twist = lerp(-0.55, 0, k); elbow = lerp(-0.1, -0.5, k);
    }
    P.armR.shoulder.rotation.x = shoulder;
    P.armR.shoulder.rotation.z = 0.15;
    P.armR.elbow.rotation.x = elbow;
    P.torso.rotation.y = twist;
  }
  P.bagPunch = Math.max(0, P.bagPunch - dt * 6);
  P.bag.scale.setScalar(1 + P.bagPunch * 0.18);
}

function nearestNode() {
  const p = player.root.position;
  let best = null;
  let bestGap = REACH;
  for (const n of world.nodes) {
    if (n.respawn > 0 || n.k >= openZonesHere()) continue;
    const gap = Math.hypot(n.x - p.x, n.z - p.z) - n.radius;
    if (gap < bestGap) { best = n; bestGap = gap; }
  }
  return best;
}

function swing() {
  if (player.swingT < 1) return;
  player.swingT = 0;
  sound.play("swing");
  const node = nearestNode();
  if (!node) return;
  if (state.bagCount >= capacity()) {
    sound.play("full");
    return;
  }
  const p = player.root.position;
  player.facing = Math.atan2(node.x - p.x, node.z - p.z);
  setTimeout(() => hit(node), SWING_TIME * 450);
}

function hit(node) {
  if (node.respawn > 0) return;
  const zone = zoneIndex(world.index, node.k);
  const balls = Math.min(gearPower(state.gear), capacity() - state.bagCount);
  if (balls === 0) return;
  state.bagCount += balls;
  state.bagValue += balls * ballValue(zone) * cashBoost();
  node.punch = 1;
  node.hits--;
  sound.play("hit");
  const top = new THREE.Vector3(node.x, node.kind === "giant" ? 2.8 : 1.6, node.z);
  particles.burst(top, { count: 8, colors: [0xffffff, 0xfde68a], speed: 5, up: 3, life: 0.4, size: 0.12 });
  popup(`+${fmt(balls)} ${world.def.icon}`, top.x, top.y + 1, top.z, "info");
  launchFlyers(top, Math.min(balls, 5));
  if (node.hits === 0) {
    node.respawn = RESPAWN_TIME;
    node.breakT = 0;
    sound.play("break");
    particles.burst(top, { count: 22, colors: [world.def.accent, 0xffffff, 0xfbbf24], speed: 7, up: 6, life: 0.9, size: 0.2 });
    shake = 0.35;
  }
  refreshHud();
}

function launchFlyers(from, count) {
  for (let i = 0; i < count; i++) {
    const mesh = world.flyerPool.find(m => !m.visible);
    if (!mesh) return;
    mesh.visible = true;
    mesh.position.copy(from);
    world.flyers.push({ mesh, from: from.clone().add(new THREE.Vector3((Math.random() - 0.5) * 1.2, 0, (Math.random() - 0.5) * 1.2)), t: -i * 0.06, index: i });
  }
}

const bagWorld = new THREE.Vector3();
function updateFlyers(dt) {
  player.bag.getWorldPosition(bagWorld);
  world.flyers = world.flyers.filter(f => {
    f.t += dt / 0.42;
    if (f.t < 0) return true;
    if (f.t >= 1) {
      f.mesh.visible = false;
      player.bagPunch = 1;
      sound.play("collect", f.index);
      return false;
    }
    const t = f.t;
    f.mesh.position.lerpVectors(f.from, bagWorld, t);
    f.mesh.position.y += Math.sin(t * Math.PI) * 2.2;
    f.mesh.rotation.x += dt * 12;
    f.mesh.scale.setScalar(1 - t * 0.5);
    return true;
  });
}

function updateNodes(dt) {
  for (const n of world.nodes) {
    if (n.respawn > 0) {
      n.respawn -= dt;
      n.breakT = Math.min(1, n.breakT + dt * 5);
      n.group.scale.setScalar(Math.max(0.001, 1 - n.breakT));
      n.group.rotation.y += dt * 8 * (1 - n.breakT);
      if (n.respawn <= 0) {
        n.hits = NODE_SPEC[n.kind].hits;
        n.grow = 0;
      }
      continue;
    }
    n.punch = Math.max(0, n.punch - dt * 4);
    n.grow = Math.min(1, n.grow + dt * 2.5);
    const pop = n.grow < 1 ? easeOutBack(n.grow) : 1;
    const squash = Math.sin(n.punch * Math.PI) * 0.18;
    n.group.scale.set(pop * (1 + squash), pop * (1 - squash), pop * (1 + squash));
  }
}

function sell() {
  const p = player.root.position;
  popup(`+${money(state.bagValue)}`, p.x, p.y + 4.4, p.z, "cashpop");
  flyCoins(p);
  sound.play("sell");
  particles.burst(new THREE.Vector3(p.x, 2.5, p.z), { count: 18, colors: [0x22c55e, 0xfbbf24, 0xffffff], speed: 5, up: 7, life: 1, size: 0.18 });
  state.cash += state.bagValue;
  state.bagCount = 0;
  state.bagValue = 0;
  world.hype = Math.max(world.hype, 0.4);
  refreshHud();
}

// =====================================================================
// Pets that follow the player
// =====================================================================

let followers = [];
const FOLLOW_SLOTS = [[-1.5, -2.3], [1.5, -2.3], [-1.6, -4], [1.6, -4]];

function buildFollowers() {
  followers.forEach(f => scene.remove(f.group));
  const p = player.root.position;
  followers = equippedPets().map((pet, i) => {
    const group = new THREE.Group();
    const model = petTemplate(pet).clone();
    group.add(model);
    group.position.set(p.x, 0, p.z);
    scene.add(group);
    return { pet, group, model, hop: Math.random() * 6, slot: FOLLOW_SLOTS[i] };
  });
}

function updateFollowers(dt) {
  const p = player.root.position;
  const sinF = Math.sin(player.facing);
  const cosF = Math.cos(player.facing);
  for (const f of followers) {
    const [sx, sz] = f.slot;
    const tx = p.x + sx * cosF + sz * sinF;
    const tz = p.z - sx * sinF + sz * cosF;
    const dx = tx - f.group.position.x;
    const dz = tz - f.group.position.z;
    const dist = Math.hypot(dx, dz);
    f.group.position.x = damp(f.group.position.x, tx, 5, dt);
    f.group.position.z = damp(f.group.position.z, tz, 5, dt);
    const moving = dist > 0.4;
    f.hop += dt * (moving ? 11 : 3);
    const hop = Math.abs(Math.sin(f.hop));
    f.group.position.y = moving ? hop * 0.55 : 0.05 + Math.sin(f.hop) * 0.04;
    f.model.scale.set(1 + (moving ? (1 - hop) * 0.12 : 0), 1 - (moving ? (1 - hop) * 0.12 : 0), 1);
    const want = moving ? Math.atan2(dx, dz) : player.facing;
    const turn = Math.atan2(Math.sin(want - f.group.rotation.y), Math.cos(want - f.group.rotation.y));
    f.group.rotation.y += turn * (1 - Math.exp(-dt * 8));
  }
}

function rollPet() {
  let roll = Math.random() * 100;
  const rarity = RARITIES.findIndex(r => (roll -= r.chance) < 0);
  if (rarity < 0) throw new Error("Rarity chances must add up to 100");
  return PETS.find(p => p.world === state.world && p.rarity === rarity);
}

// =====================================================================
// Showcase renderer: shop thumbnails and the egg-hatch scene
// =====================================================================

// One WebGL context only: a second context made every frame far slower.
const showcase = (() => {
  const sc = new THREE.Scene();
  sc.environment = scene.environment;
  sc.add(new THREE.HemisphereLight(0xffffff, 0x334155, 0.8));
  const key = new THREE.DirectionalLight(0xffffff, 2.2);
  key.position.set(3, 5, 4);
  sc.add(key);
  const cam = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  const stage = new THREE.Group();
  sc.add(stage);
  const dimScene = new THREE.Scene();
  dimScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ color: 0x040918, transparent: true, opacity: 0.72, depthTest: false, depthWrite: false, toneMapped: false })));
  const dimCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  return { scene: sc, camera: cam, stage, dimScene, dimCamera, particles: new Particles(sc, 200) };
})();

const thumbs = { gear: [], bag: [], pet: [], egg: [] };
function renderThumb(object, tilt = 0.5) {
  const s = showcase;
  s.camera.aspect = 1;
  s.camera.updateProjectionMatrix();
  const holder = new THREE.Group();
  holder.add(object);
  holder.rotation.y = tilt;
  s.stage.add(holder);
  const box = new THREE.Box3().setFromObject(holder);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const dist = (Math.max(size.x, size.y, size.z) / 2 / Math.tan((s.camera.fov * Math.PI) / 360)) * 1.25;
  s.camera.position.set(center.x, center.y + dist * 0.25, center.z + dist);
  s.camera.lookAt(center);
  renderer.render(s.scene, s.camera);
  const url = canvas.toDataURL();
  s.stage.remove(holder);
  return url;
}
function buildThumbnails() {
  renderer.setSize(160, 160, false);
  renderer.setClearColor(0x1a2a52);
  GEAR.forEach(gear => {
    const model = gearModel(gear);
    model.rotation.z = -0.7;
    thumbs.gear.push(renderThumb(model, 0.3));
  });
  BAGS.forEach(bag => thumbs.bag.push(renderThumb(bagModel(bag.tier), 0.6)));
  PETS.forEach(pet => thumbs.pet.push(renderThumb(petTemplate(pet).clone(), 0.45)));
  WORLDS.forEach((def, w) => thumbs.egg.push(renderThumb(eggModel(w, false).group, 0.3)));
}

let hatchFx = null;
const CRACK_T = 1.9;
const TICK_TIMES = [0.45, 0.75, 1.0, 1.2, 1.36, 1.5, 1.62, 1.72, 1.8];

function startHatch(pets) {
  const s = showcase;
  closeHatch();
  s.camera.aspect = innerWidth / innerHeight;
  s.camera.updateProjectionMatrix();
  s.camera.position.set(0, 1.1, pets.length > 1 ? 10 : 6.5);
  s.camera.lookAt(0, 0.8, 0);
  hatchFx = {
    t: 0,
    ticks: 0,
    cracked: false,
    items: pets.map((pet, i) => {
      const x = (i - (pets.length - 1) / 2) * 2.7;
      const egg = eggModel(state.world, true);
      egg.group.position.x = x;
      egg.group.scale.setScalar(0.001);
      s.stage.add(egg.group);
      const petObj = petTemplate(pet).clone();
      petObj.position.set(x, 0, 0);
      petObj.scale.setScalar(0.001);
      s.stage.add(petObj);
      return { pet, x, egg, petObj, vTop: new THREE.Vector3((Math.random() - 0.5) * 3, 5, 2), vBottom: new THREE.Vector3((Math.random() - 0.5) * 2, 1.5, 1) };
    }),
  };
  $("hatch-info").innerHTML = "";
  $("hatch-hint").hidden = true;
  $("hatch").hidden = false;
  document.body.classList.add("hatching");
}

function updateHatch(dt) {
  const h = hatchFx;
  const s = showcase;
  h.t += dt;
  const t = h.t;
  while (!h.cracked && h.ticks < TICK_TIMES.length && t >= TICK_TIMES[h.ticks]) sound.play("tick", h.ticks++);
  if (!h.cracked && t >= CRACK_T) {
    h.cracked = true;
    flash();
    sound.play("crack");
    const best = Math.max(...h.items.map(it => it.pet.rarity));
    setTimeout(() => sound.play("reveal", best), 150);
    if (best >= 3) sound.play("cheer");
    for (const it of h.items) {
      s.particles.burst(new THREE.Vector3(it.x, 0.9, 0), { count: 30 + it.pet.rarity * 10, colors: [RARITY_HEX[it.pet.rarity], 0xffffff, 0xfbbf24], speed: 4, up: 5, gravity: 7, life: 1.4, size: 0.12 });
    }
    $("hatch-info").innerHTML = h.items.map(it => `
      <div class="reveal">
        <span class="rarity r${it.pet.rarity}">${RARITIES[it.pet.rarity].name}</span>
        <span class="pet-name r${it.pet.rarity}">${it.pet.name}</span>
        <span class="sub">${pct(it.pet.bonus)} cash</span>
      </div>`).join("");
  }
  if (h.cracked && t > CRACK_T + 0.8) $("hatch-hint").hidden = false;
  if (t > CRACK_T + 5) { closeHatch(); return; }
  for (const it of h.items) {
    if (!h.cracked) {
      const pop = Math.min(1, t / 0.35);
      const shake = clamp((t - 0.35) / 1.5, 0, 1);
      it.egg.group.scale.setScalar(Math.max(0.001, easeOutBack(pop)) * 1.5);
      it.egg.group.rotation.z = t > 0.35 ? Math.sin(t * (10 + shake * 20) + it.x) * (0.04 + shake * 0.3) : 0;
      it.egg.group.position.y = Math.abs(Math.sin(t * (6 + shake * 10))) * 0.1 * shake;
    } else {
      const ct = t - CRACK_T;
      it.vTop.y -= 14 * dt;
      it.vBottom.y -= 14 * dt;
      it.egg.top.position.addScaledVector(it.vTop, dt);
      it.egg.bottom.position.addScaledVector(it.vBottom, dt);
      it.egg.top.rotation.x += dt * 7;
      it.egg.bottom.rotation.z += dt * 3;
      it.egg.material.opacity = Math.max(0, 1 - ct / 0.5);
      const grow = Math.min(1, ct / 0.5);
      it.petObj.scale.setScalar(Math.max(0.001, easeOutBack(grow)) * 1.2);
      it.petObj.rotation.y = (1 - smooth(Math.min(1, ct / 0.8))) * -Math.PI * 2 + Math.sin(t * 1.6) * 0.35;
      it.petObj.position.y = Math.abs(Math.sin(t * 3)) * 0.15;
    }
  }
  s.particles.update(dt);
  renderer.autoClear = false;
  renderer.render(s.dimScene, s.dimCamera);
  renderer.clearDepth();
  renderer.render(s.scene, s.camera);
  renderer.autoClear = true;
}

function closeHatch() {
  if (!hatchFx) return;
  for (const it of hatchFx.items) {
    showcase.stage.remove(it.egg.group, it.petObj);
    it.egg.material.dispose();
  }
  hatchFx = null;
  $("hatch").hidden = true;
  document.body.classList.remove("hatching");
}
$("hatch").addEventListener("click", () => {
  if (hatchFx && hatchFx.cracked) closeHatch();
});

const cam = { yaw: 0, pitch: 0.38, dist: 16 };
const camTarget = new THREE.Vector3();
const camGoal = new THREE.Vector3();
let drag = null;
let shake = 0;

canvas.addEventListener("pointerdown", e => {
  sound.unlock();
  drag = { x: e.clientX, y: e.clientY, moved: false };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  const dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 6) return;
  drag.moved = true;
  drag.x = e.clientX;
  drag.y = e.clientY;
  cam.yaw -= dx * 0.006;
  cam.pitch = clamp(cam.pitch + dy * 0.005, 0.08, 1.3);
});
canvas.addEventListener("pointerup", () => {
  if (drag && !drag.moved) swing();
  drag = null;
});
canvas.addEventListener("pointercancel", () => { drag = null; });
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  cam.dist = clamp(cam.dist + e.deltaY * 0.02, 7, 34);
}, { passive: false });

function updateCamera(dt, snap = false) {
  const p = player.root.position;
  camTarget.set(p.x, p.y * 0.6 + 2.3, p.z);
  const flat = Math.cos(cam.pitch) * cam.dist;
  camGoal.set(p.x + Math.sin(cam.yaw) * flat, camTarget.y + Math.sin(cam.pitch) * cam.dist, p.z + Math.cos(cam.yaw) * flat);
  let boom = 1;
  const keepInside = (value, lo, hi, base) => {
    if (value > hi) boom = Math.min(boom, (hi - base) / (value - base));
    if (value < lo) boom = Math.min(boom, (lo - base) / (value - base));
  };
  keepInside(camGoal.x, -HALF + 0.5, HALF - 0.5, camTarget.x);
  keepInside(camGoal.z, END_Z + 0.5, BACK_Z - 0.5, camTarget.z);
  camGoal.lerpVectors(camTarget, camGoal, boom);
  if (snap) camera.position.copy(camGoal);
  else camera.position.lerp(camGoal, 1 - Math.exp(-dt * 12));
  shake = Math.max(0, shake - dt * 2.5);
  camera.position.x += (Math.random() - 0.5) * shake * 0.5;
  camera.position.y += (Math.random() - 0.5) * shake * 0.5;
  camera.lookAt(camTarget);
  sky.position.copy(camera.position);
  sun.position.copy(p).add(SUN_OFFSET);
  sun.target.position.copy(p);
}

const projected = new THREE.Vector3();
function screenOf(x, y, z) {
  projected.set(x, y, z).project(camera);
  return { x: ((projected.x + 1) / 2) * innerWidth, y: ((1 - projected.y) / 2) * innerHeight };
}
function popup(text, x, y, z, kind) {
  const at = screenOf(x, y, z);
  const el = document.createElement("div");
  el.className = `pop ${kind}`;
  el.textContent = text;
  el.style.left = `${at.x}px`;
  el.style.top = `${at.y}px`;
  el.addEventListener("animationend", () => el.remove());
  $("fx").append(el);
}
function flyCoins(p) {
  const from = screenOf(p.x, p.y + 2.5, p.z);
  const target = $("cash").getBoundingClientRect();
  for (let i = 0; i < 8; i++) {
    const el = document.createElement("div");
    el.className = "coin-fly";
    el.textContent = "$";
    el.style.left = `${from.x + (Math.random() - 0.5) * 60}px`;
    el.style.top = `${from.y + (Math.random() - 0.5) * 40}px`;
    el.style.transitionDelay = `${i * 45}ms`;
    $("fx").append(el);
    el.getBoundingClientRect();
    el.style.transform = `translate(${target.left + 20 - parseFloat(el.style.left)}px, ${target.top + 16 - parseFloat(el.style.top)}px) scale(0.7)`;
    el.style.opacity = "0.4";
    el.addEventListener("transitionend", () => el.remove(), { once: true });
  }
  setTimeout(() => {
    $("cash").classList.remove("bump");
    void $("cash").offsetWidth;
    $("cash").classList.add("bump");
  }, 700);
}

let travelling = false;
function travelTo(w) {
  if (travelling) return;
  travelling = true;
  closePanel();
  sound.play("travel");
  $("fade").classList.add("on");
  setTimeout(() => {
    state.world = w;
    enterWorld();
    $("fade").classList.remove("on");
    travelling = false;
    toast(`WORLD ${w + 1}`, WORLDS[w].name);
  }, 450);
}

function enterWorld() {
  buildWorld(state.world);
  dressPlayer();
  player.root.position.set(0, 0, SPAWN_Z);
  player.velocity.set(0, 0, 0);
  player.facing = Math.PI;
  player.body.rotation.y = Math.PI;
  cam.yaw = 0;
  currentPad = null;
  gatePrompted = false;
  atPortal = false;
  currentZone = 0;
  buildFollowers();
  updateCamera(0, true);
  refreshHud();
}

// =====================================================================
// Pads, gates, portal and zone changes
// =====================================================================

let currentPad = null;
let gatePrompted = false;
let atPortal = false;
let currentZone = 0;

function updateTriggers() {
  const p = player.root.position;

  const pad = world.pads.find(pd => Math.hypot(pd.x - p.x, pd.z - p.z) < PAD_RADIUS) ?? null;
  if (pad !== currentPad) {
    if (currentPad && panelKind === currentPad.kind) closePanel();
    currentPad = pad;
    if (pad && pad.kind !== "sell") openPanel(pad.kind);
  }
  if (pad?.kind === "sell" && state.bagCount > 0) sell();

  if (openZonesHere() < 3) {
    const fromGate = p.z - minZ();
    if (fromGate < 0.05 && !gatePrompted) {
      gatePrompted = true;
      openPanel("gate");
    }
    if (fromGate > 3) {
      gatePrompted = false;
      if (panelKind === "gate") closePanel();
    }
  }

  const nearPortal = world.portal.visible && Math.hypot(p.x, p.z - PORTAL_Z) < 3.4;
  if (nearPortal !== atPortal) {
    atPortal = nearPortal;
    if (nearPortal) openPanel("portal");
    else if (panelKind === "portal") closePanel();
  }

  const zone = zoneAt(p.z);
  if (zone !== currentZone) {
    currentZone = zone;
    toast(`ZONE ${zone + 1}`, world.def.zones[zone]);
    refreshHud();
  }
}

function updateWorldFx(dt) {
  world.gateMat.map.offset.x -= dt * 0.25;
  if (world.swirl) world.swirl.material.uniforms.time.value = clock;
  if (world.trophy) world.trophy.rotation.y += dt * 0.6;
  for (const pad of world.pads) {
    pad.label.material.opacity = clamp((camera.position.distanceTo(pad.label.position) - 6) / 8, 0, 1);
    if (pad.model.userData.egg) {
      const egg = pad.model.userData.egg;
      egg.rotation.y += dt * 0.8;
      egg.position.y = 1.3 + Math.sin(clock * 2) * 0.15;
    }
    if (pad.model.userData.swirl) pad.model.userData.swirl.material.uniforms.time.value = clock;
  }
  for (const gate of world.gates) {
    if (gate.sinking < 0) continue;
    gate.sinking = Math.min(1, gate.sinking + dt * 1.2);
    gate.group.position.y = -10 * smooth(gate.sinking);
    if (gate.sinking === 1) gate.group.visible = false;
  }
  world.hype = Math.max(0, world.hype - dt * 0.35);
  updateCrowd(world.crowd, clock, world.hype);
  for (const cloud of clouds) {
    cloud.position.x += dt * 2;
    if (cloud.position.x > 260) cloud.position.x = -260;
  }
}

// =====================================================================
// Main loop
// =====================================================================

let clock = 0;
let saveClock = 0;

await Promise.all(['64px "Russo One"', '64px "Graduate"', '600 16px "Barlow"'].map(f => document.fonts.load(f)));
player = makePlayer();
buildThumbnails();
renderer.setClearColor(0x000000);
resize();
addEventListener("resize", resize);
addEventListener("pagehide", saveState);
refreshMute();
enterWorld();
let last = performance.now();
$("cash").textContent = fmt(state.cash);
$("loading").hidden = true;
toast(`WORLD ${state.world + 1}`, WORLDS[state.world].name);

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  clock += dt;

  updatePlayer(dt);
  if (state.auto && state.bagCount < capacity() && nearestNode()) swing();
  updateNodes(dt);
  updateFlyers(dt);
  updateFollowers(dt);
  updateTriggers();
  updateWorldFx(dt);
  particles.update(dt);
  updateCamera(dt);
  updateCashDisplay(dt);
  renderer.render(scene, camera);
  if (hatchFx) updateHatch(dt);

  saveClock += dt;
  if (saveClock > 3) {
    saveClock = 0;
    if (dirty) {
      saveState();
      dirty = false;
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
